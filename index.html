<script>

  document.getElementById("view-pdf1").style.display = view === "pdf1" ? "block" : "none";

  ["map", "pdf1", "pdf2"].forEach(v => {
    const btn = document.getElementById("btn-" + v);

      btn.style.background = "#fff";
      btn.style.color = "#008187";
    } else {
      btn.style.background = "transparent";
      btn.style.color = "#fff";
    }
  });
}
