<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>屈臣氏防損責任區導覽</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #0f172a; }
  
  #top-navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: #008187;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  }
  .nav-title { color: #fff; font-weight: bold; font-size: 13px; }
  .nav-btns { display: flex; gap: 6px; }
  .nav-btn {
    padding: 6px 10px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.4);
    background: transparent;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn.active {
    background: #fff;
    color: #008187;
    border-color: #fff;
  }

  .view-container {
    position: absolute;
    top: 52px; bottom: 0; left: 0; right: 0;
    width: 100%; height: calc(100% - 52px);
  }
  .view-panel {
    width: 100%; height: 100%;
    display: none;
    border: none;
  }
  .view-panel.active { display: block; }
</style>
</head>
<body>

<div id="top-navbar">
  <span class="nav-title">屈臣氏防損巡檢 (96家)</span>
  <div class="nav-btns">
    <button class="nav-btn active" id="btn-map" onclick="switchView('map')">🗺️ 地圖</button>
    <button class="nav-btn" id="btn-types" onclick="switchView('types')">📄 店型</button>
    <button class="nav-btn" id="btn-traffic" onclick="switchView('traffic')">🛣️ 動線</button>
  </div>
</div>

<div class="view-container">
  <iframe src="map.html?v=8" id="panel-map" class="view-panel active"></iframe>
  <iframe src="store_types.html?v=8" id="panel-types" class="view-panel"></iframe>
  <iframe src="traffic_map.html?v=8" id="panel-traffic" class="view-panel"></iframe>
</div>

<script>
function switchView(tab) {
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('btn-' + tab).classList.add('active');
}
</script>














<!-- 訪客自動日誌追蹤 (精準對齊 processForm 欄位) -->
<iframe name="gas_hidden_frame" id="gas_hidden_frame" style="display:none;"></iframe>
<form id="gas_auto_form" action="https://script.google.com/macros/s/AKfycbxDFqVzHpbETfBoHZCAx4p0hblwClwSZo8Xikfb2CsL/exec" method="POST" target="gas_hidden_frame" style="display:none;">
  <input type="hidden" name="action" value="feedback">
  <input type="hidden" name="storeName" value="屈臣氏專案">
  <input type="hidden" name="category" value="訪客造訪">
  <input type="hidden" name="comment" id="gas_comment_field" value="造訪網頁：屈臣氏防損責任區巡檢導覽(96家)">
</form>

<script>
(function() {
  try {
    var now = new Date();
    var timeStr = now.getFullYear() + "/" + 
                  String(now.getMonth() + 1).padStart(2, '0') + "/" + 
                  String(now.getDate()).padStart(2, '0') + " " + 
                  String(now.getHours()).padStart(2, '0') + ":" + 
                  String(now.getMinutes()).padStart(2, '0') + ":" + 
                  String(now.getSeconds()).padStart(2, '0');

    var detail = "造訪屈臣氏導覽 | 時間：" + timeStr + " | 來源：" + (document.referrer || "直接開啟/面試官") + " | 裝置：" + (navigator.userAgent || "");
    
    // 設定 comment 欄位值
    var commentInput = document.getElementById("gas_comment_field");
    if (commentInput) {
      commentInput.value = detail;
    }

    // 自動以 POST 送出表單到隱藏 iframe (保證跨域穿透成功)
    var form = document.getElementById("gas_auto_form");
    if (form) {
      form.submit();
    }

    // 備援雙保險：若後端有改寫支援 GET
    var params = new URLSearchParams({
      storeName: "屈臣氏專案",
      category: "訪客造訪",
      comment: detail
    });
    fetch("https://script.google.com/macros/s/AKfycbxDFqVzHpbETfBoHZCAx4p0hblwClwSZo8Xikfb2CsL/exec?" + params.toString(), { method: "GET", mode: "no-cors" }).catch(function(){});
  } catch(e) {}
})();
</script>

</body>
</html>
