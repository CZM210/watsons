<script>
let pStart = null, pEnd = null, navLine = null;
let startName = "", endName = "";

let foliumMap = null;
for (let key in window) {
  if (key.startsWith("map_")) {
    foliumMap = window[key];
    break;
  }
}

// 快速精確計算兩點經緯度距離 (公里)

<script>
// 找到 Leaflet 地圖物件並綁定到 window.myMap
setTimeout(function() {
  for (let key in window) {
    if (key.startsWith("map_") && window[key] && typeof window[key].addLayer === 'function') {
      window.myMap = window[key];
      break;
    }
  }
}, 500);

function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return (R * c * 1.28).toFixed(1);
}

function setPoint(type, name, lat, lng) {
  if (!window.myMap) {
    for (let key in window) {
      if (key.startsWith("map_") && window[key] && typeof window[key].addLayer === 'function') {
        window.myMap = window[key];
        break;
      }
    }
  }

  if (type === 'start') {
    pStart = [parseFloat(lat), parseFloat(lng)];
    startName = name;
    document.getElementById('route-msg').innerHTML = '起點：<span style="color:#16a34a">' + name + '</span> (請點選迄點)';
    document.getElementById('route-action').style.display = 'none';
  } else {
    pEnd = [parseFloat(lat), parseFloat(lng)];
    endName = name;
  }

  // 關閉目前開啟的 popup
  if (window.myMap) {
    window.myMap.closePopup();
  }

  if (pStart && pEnd && window.myMap) {
    if (navLine) {
      window.myMap.removeLayer(navLine);
    }

    navLine = L.polyline([pStart, pEnd], {
      color: '#0284c7',
      weight: 6,
      opacity: 0.9,
      dashArray: '8, 8'
    }).addTo(window.myMap);

    window.myMap.fitBounds(navLine.getBounds(), { padding: [50, 50] });

    let dist = getDistance(pStart[0], pStart[1], pEnd[0], pEnd[1]);
    let mins = Math.round(dist * 1.6);

    document.getElementById('route-msg').innerHTML = 
      '路程預估：<b>' + dist + ' 公里</b> (約 <b>' + mins + ' 分鐘</b>)';

    let gmapUrl = 'https://www.google.com/maps/dir/?api=1&origin=' + pStart[0] + ',' + pStart[1] + '&destination=' + pEnd[0] + ',' + pEnd[1] + '&travelmode=driving';
    document.getElementById('gmap-link').href = gmapUrl;
    document.getElementById('route-action').style.display = 'block';
  }
}
</script>
